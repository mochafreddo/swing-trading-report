services:
  scheduler:
    image: astral/uv:python3.14-trixie-slim@sha256:d9fb7d2b1c1922d191f1f77cb68b119c0a231f876f3affcce9bfac86e564c20a
    restart: "no"
    working_dir: /workspace
    env_file:
      - ${SAB_SCHEDULER_ENV_FILE:-.env.scheduler.local}
    environment:
      UV_CACHE_DIR: /workspace/.uv-cache
      UV_PROJECT_ENVIRONMENT: /opt/sab-scheduler-venv
      PYTHONUNBUFFERED: "1"
      LOG_FORMAT: json
      LOG_TZ: utc
    volumes:
      - .:/workspace
      - ./.uv-cache:/workspace/.uv-cache
      - ./data:/workspace/data
      - ./reports:/workspace/reports
      - sab_scheduler_venv:/opt/sab-scheduler-venv
    command: uv run python -m sab ai-brief-scheduled

volumes:
  sab_scheduler_venv:
