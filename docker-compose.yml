x-web-env: &web-env
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_REPORTS_BUCKET: ${SUPABASE_REPORTS_BUCKET:-reports}
  RUN_DISPATCH_ENABLED: ${RUN_DISPATCH_ENABLED:-}
  GITHUB_OWNER: ${GITHUB_OWNER:-}
  GITHUB_REPO: ${GITHUB_REPO:-}
  GITHUB_PAT: ${GITHUB_PAT:-}
  SAB_BASIC_AUTH_USER: ${SAB_BASIC_AUTH_USER:-}
  SAB_BASIC_AUTH_PASS: ${SAB_BASIC_AUTH_PASS:-}
  SAB_SESSION_SECRET: ${SAB_SESSION_SECRET:-}
  SAB_SESSION_COOKIE_SECURE: ${SAB_SESSION_COOKIE_SECURE:-false}
  TOSS_INVEST_CLIENT_ID: ${TOSS_INVEST_CLIENT_ID:-}
  TOSS_INVEST_CLIENT_SECRET: ${TOSS_INVEST_CLIENT_SECRET:-}
  TOSS_INVEST_ACCOUNT: ${TOSS_INVEST_ACCOUNT:-}
  TOSS_INVEST_BASE_URL: ${TOSS_INVEST_BASE_URL:-}
  TOSS_SYNC_SOURCE: ${TOSS_SYNC_SOURCE:-}
  TOSS_SYNC_QA_FIXTURE_ENABLED: ${TOSS_SYNC_QA_FIXTURE_ENABLED:-}
  TOSS_SYNC_JOB_TOKEN: ${TOSS_SYNC_JOB_TOKEN:-}
  TOSS_SYNC_AUTO_APPLY_ENABLED: ${TOSS_SYNC_AUTO_APPLY_ENABLED:-}
  REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
  REPORT_SEARCH_WINDOW: ${REPORT_SEARCH_WINDOW:-100}
  DECISION_BOARD_JOURNAL_DIR: /var/lib/sab/decision-board-journal
  DECISION_BOARD_JOURNAL_PYTHON: /usr/bin/python3
  DECISION_BOARD_JOURNAL_HELPER: /opt/sab/decision_board/run_journal_public.py
  DECISION_BOARD_JOURNAL_LIMIT: ${DECISION_BOARD_JOURNAL_LIMIT:-20}
  DECISION_BOARD_JOURNAL_SCAN_LIMIT: ${DECISION_BOARD_JOURNAL_SCAN_LIMIT:-200}
  DECISION_BOARD_JOURNAL_MAX_RECORD_BYTES: ${DECISION_BOARD_JOURNAL_MAX_RECORD_BYTES:-65536}
  DECISION_BOARD_JOURNAL_MAX_OUTPUT_BYTES: ${DECISION_BOARD_JOURNAL_MAX_OUTPUT_BYTES:-262144}
  DECISION_BOARD_JOURNAL_TIMEOUT_MS: ${DECISION_BOARD_JOURNAL_TIMEOUT_MS:-1500}

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: sab-web
    restart: unless-stopped
    environment:
      <<: *web-env
      NODE_ENV: production
      WEB_BIND_HOST: 0.0.0.0
      SAB_ALLOW_NON_LOOPBACK_BIND: "1"
      SAB_TRUST_HOST_HEADER_FOR_LOCAL_REQUESTS: "1"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-55300}:3000"
    volumes:
      - ${DECISION_BOARD_JOURNAL_HOST_DIR:-./logs/decision-board-journal}:/var/lib/sab/decision-board-journal:ro

  web-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: web/Dockerfile.dev
    container_name: sab-web-dev
    restart: unless-stopped
    environment:
      <<: *web-env
      NODE_ENV: development
      WEB_BIND_HOST: 0.0.0.0
      SAB_ALLOW_NON_LOOPBACK_BIND: "1"
      SAB_TRUST_HOST_HEADER_FOR_LOCAL_REQUESTS: "1"
    ports:
      - "127.0.0.1:${WEB_DEV_HOST_PORT:-55301}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - ${DECISION_BOARD_JOURNAL_HOST_DIR:-./logs/decision-board-journal}:/var/lib/sab/decision-board-journal:ro
    command: pnpm run dev

volumes:
  web_node_modules:
