x-web-env: &web-env
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
  SUPABASE_REPORTS_BUCKET: ${SUPABASE_REPORTS_BUCKET:-reports}
  RUN_DISPATCH_ENABLED: ${RUN_DISPATCH_ENABLED:-}
  GITHUB_OWNER: ${GITHUB_OWNER:-}
  GITHUB_REPO: ${GITHUB_REPO:-}
  GITHUB_PAT: ${GITHUB_PAT:-}
  SAB_BASIC_AUTH_USER: ${SAB_BASIC_AUTH_USER:-}
  SAB_BASIC_AUTH_PASS: ${SAB_BASIC_AUTH_PASS:-}
  SAB_SESSION_SECRET: ${SAB_SESSION_SECRET:-}
  SAB_SESSION_COOKIE_SECURE: ${SAB_SESSION_COOKIE_SECURE:-false}
  TOSS_INVEST_CLIENT_ID: ${TOSS_INVEST_CLIENT_ID:-}
  TOSS_INVEST_CLIENT_SECRET: ${TOSS_INVEST_CLIENT_SECRET:-}
  TOSS_INVEST_ACCOUNT: ${TOSS_INVEST_ACCOUNT:-}
  TOSS_INVEST_BASE_URL: ${TOSS_INVEST_BASE_URL:-}
  TOSS_SYNC_JOB_TOKEN: ${TOSS_SYNC_JOB_TOKEN:-}
  TOSS_SYNC_AUTO_APPLY_ENABLED: ${TOSS_SYNC_AUTO_APPLY_ENABLED:-}
  REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
  REPORT_SEARCH_WINDOW: ${REPORT_SEARCH_WINDOW:-100}

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sab-web
    restart: unless-stopped
    environment:
      <<: *web-env
      NODE_ENV: production
      WEB_BIND_HOST: 0.0.0.0
      SAB_ALLOW_NON_LOOPBACK_BIND: "1"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-55300}:3000"

  web-dev:
    profiles: ["dev"]
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: sab-web-dev
    restart: unless-stopped
    environment:
      <<: *web-env
      NODE_ENV: development
      WEB_BIND_HOST: 0.0.0.0
      SAB_ALLOW_NON_LOOPBACK_BIND: "1"
    ports:
      - "127.0.0.1:${WEB_DEV_HOST_PORT:-55301}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: pnpm run dev

volumes:
  web_node_modules:
