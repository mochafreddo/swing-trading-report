services:
  web:
    build:
      context: ./web
    container_name: sab-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_REPORTS_BUCKET: ${SUPABASE_REPORTS_BUCKET:-reports}
      GITHUB_OWNER: ${GITHUB_OWNER:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      SAB_BASIC_AUTH_USER: ${SAB_BASIC_AUTH_USER:-}
      SAB_BASIC_AUTH_PASS: ${SAB_BASIC_AUTH_PASS:-}
      SAB_SESSION_SECRET: ${SAB_SESSION_SECRET:-}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      REPORT_SEARCH_WINDOW: ${REPORT_SEARCH_WINDOW:-100}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-55300}:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    command: pnpm run dev

volumes:
  web_node_modules:
