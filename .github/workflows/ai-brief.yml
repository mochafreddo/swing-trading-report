name: AI Brief pipeline

on:
  schedule:
    # US canary early monitor, 08:30 ET Monday-Friday across EDT/EST.
    - cron: "30 12 * * 1-5"
    - cron: "30 13 * * 1-5"
    # US canary GitHub fallback, 08:55 ET Monday-Friday across EDT/EST.
    - cron: "55 12 * * 1-5"
    - cron: "55 13 * * 1-5"
    # US canary cutoff alert, 09:29 ET Monday-Friday across EDT/EST.
    - cron: "29 13 * * 1-5"
    - cron: "29 14 * * 1-5"
  workflow_dispatch:
    inputs:
      market:
        description: "Single market to scan, entry-check, and brief"
        required: false
        default: KR
        type: choice
        options:
          - KR
          - US
      provider:
        description: "Data provider"
        required: false
        default: kis
        type: choice
        options:
          - kis
          - pykrx
      universe:
        description: "Scan universe"
        required: false
        default: both
        type: choice
        options:
          - watchlist
          - screener
          - both
      entry_mode:
        description: "Entry evaluation mode"
        required: false
        default: PRE_OPEN
        type: choice
        options:
          - PRE_OPEN
          - INTRADAY
          - AFTER_CLOSE
      model_provider:
        description: "AI brief model provider"
        required: false
        default: fake
        type: choice
        options:
          - fake
          - openai
      model_name:
        description: "AI model name; openai can also use OPENAI_AI_BRIEF_MODEL"
        required: false
        default: fake-ai-brief-v1
        type: string
      model_timeout_seconds:
        description: "Optional AI model timeout in seconds"
        required: false
        default: ""
        type: string
      source_provider:
        description: "Optional source provider"
        required: false
        default: none
        type: choice
        options:
          - none
          - local-json
          - http-json
          - finnhub
          - polygon-news
          - alpha-vantage-news
          - marketaux-news
          - benzinga-news
          - naver-news
      source_report_path:
        description: "Local source JSON path when source_provider=local-json"
        required: false
        default: ""
        type: string
      source_api_url:
        description: "External source API URL when source_provider=http-json"
        required: false
        default: ""
        type: string
      source_timeout_seconds:
        description: "Optional external source provider timeout in seconds"
        required: false
        default: ""
        type: string
      send_notifications:
        description: "Send Telegram/Slack notifications after artifact upload"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  resolve_context:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.context.outputs.should_run }}
      is_schedule: ${{ steps.context.outputs.is_schedule }}
      market: ${{ steps.context.outputs.market }}
      session_date: ${{ steps.context.outputs.session_date }}
      schedule_role: ${{ steps.context.outputs.schedule_role }}
      runner_role: ${{ steps.context.outputs.runner_role }}
      scheduled_tick: ${{ steps.context.outputs.scheduled_tick }}
      source_provider: ${{ steps.context.outputs.source_provider }}
      source_api_url: ${{ steps.context.outputs.source_api_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Resolve schedule context
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RAW_MARKET: ${{ github.event.inputs.market }}
          DEFAULT_SOURCE_PROVIDER: ${{ vars.AI_BRIEF_SOURCE_PROVIDER }}
          DEFAULT_SOURCE_PROVIDER_US: ${{ vars.AI_BRIEF_SOURCE_PROVIDER_US }}
          DEFAULT_SOURCE_API_URL: ${{ vars.AI_BRIEF_SOURCE_API_URL }}
          DEFAULT_SOURCE_API_URL_US: ${{ vars.AI_BRIEF_SOURCE_API_URL_US }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import os

          from sab.scheduler.schedule_policy import (
              dispatch_for_github_cron,
              is_within_role_window,
              market_zone,
          )

          is_schedule = os.environ["EVENT_NAME"] == "schedule"
          if is_schedule:
              try:
                  dispatch = dispatch_for_github_cron(os.environ["EVENT_SCHEDULE"])
              except KeyError as exc:
                  raise SystemExit(
                      f"Unsupported AI brief schedule: {os.environ['EVENT_SCHEDULE']}"
                  ) from exc
              market = dispatch.market
              schedule_role = dispatch.schedule_role
              runner_role = dispatch.runner_role
              scheduled_tick = dispatch.scheduled_tick
          else:
              market = (os.environ.get("RAW_MARKET") or "KR").strip().upper()
              schedule_role = "manual"
              runner_role = "manual"
              scheduled_tick = "manual"

          now = dt.datetime.now(dt.UTC)
          local_now = now.astimezone(market_zone(market))
          session_date = local_now.date().isoformat()
          source_provider = (
              os.environ.get("DEFAULT_SOURCE_PROVIDER_US")
              or os.environ.get("DEFAULT_SOURCE_PROVIDER")
              or ""
          ).strip().lower()
          source_api_url = ""
          default_source_api_url = (
              os.environ.get("DEFAULT_SOURCE_API_URL_US")
              or os.environ.get("DEFAULT_SOURCE_API_URL")
              or ""
          ).strip()
          if is_schedule and not source_provider and default_source_api_url:
              source_provider = "http-json"
          if source_provider == "http-json":
              source_api_url = default_source_api_url
          should_run = True
          if is_schedule:
              should_run = is_within_role_window(
                  market=market,
                  schedule_role=schedule_role,
                  now=now,
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={str(should_run).lower()}\n")
              out.write(f"is_schedule={str(is_schedule).lower()}\n")
              out.write(f"market={market}\n")
              out.write(f"session_date={session_date}\n")
              out.write(f"schedule_role={schedule_role}\n")
              out.write(f"runner_role={runner_role}\n")
              out.write(f"scheduled_tick={scheduled_tick}\n")
              out.write(f"source_provider={source_provider}\n")
              out.write(f"source_api_url={source_api_url}\n")
          PY

  scheduled_ai_brief:
    needs: resolve_context
    if: github.event_name == 'schedule' && needs.resolve_context.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ai-brief-${{ needs.resolve_context.outputs.market }}-${{ needs.resolve_context.outputs.session_date }}-${{ needs.resolve_context.outputs.schedule_role }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up mise toolchain
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.16
          cache: true
          install_args: --locked
          working_directory: .

      - name: Restore uv cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('mise.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run scheduled AI Brief monitor
        env:
          MARKET: ${{ needs.resolve_context.outputs.market }}
          SCHEDULE_ROLE: ${{ needs.resolve_context.outputs.schedule_role }}
          RUNNER_ROLE: ${{ needs.resolve_context.outputs.runner_role }}
          SCHEDULED_TICK: ${{ needs.resolve_context.outputs.scheduled_tick }}
          SOURCE_PROVIDER: ${{ needs.resolve_context.outputs.source_provider }}
          AI_BRIEF_SOURCE_API_URL: ${{ needs.resolve_context.outputs.source_api_url }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AI_BRIEF_MODEL: ${{ vars.OPENAI_AI_BRIEF_MODEL }}
          AI_BRIEF_MODEL_TIMEOUT_SECONDS: ${{ vars.AI_BRIEF_MODEL_TIMEOUT_SECONDS }}
          AI_BRIEF_SOURCE_API_TOKEN: ${{ needs.resolve_context.outputs.source_provider == 'http-json' && secrets.AI_BRIEF_SOURCE_API_TOKEN || '' }}
          FINNHUB_API_KEY: ${{ needs.resolve_context.outputs.source_provider == 'finnhub' && secrets.FINNHUB_API_KEY || '' }}
          POLYGON_API_KEY: ${{ needs.resolve_context.outputs.source_provider == 'polygon-news' && secrets.POLYGON_API_KEY || '' }}
          ALPHA_VANTAGE_API_KEY: ${{ needs.resolve_context.outputs.source_provider == 'alpha-vantage-news' && secrets.ALPHA_VANTAGE_API_KEY || '' }}
          MARKETAUX_API_TOKEN: ${{ needs.resolve_context.outputs.source_provider == 'marketaux-news' && secrets.MARKETAUX_API_TOKEN || '' }}
          BENZINGA_API_TOKEN: ${{ needs.resolve_context.outputs.source_provider == 'benzinga-news' && secrets.BENZINGA_API_TOKEN || '' }}
          NAVER_CLIENT_ID: ${{ needs.resolve_context.outputs.source_provider == 'naver-news' && secrets.NAVER_CLIENT_ID || '' }}
          NAVER_CLIENT_SECRET: ${{ needs.resolve_context.outputs.source_provider == 'naver-news' && secrets.NAVER_CLIENT_SECRET || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          attempt_id="${SCHEDULED_TICK}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cmd=(
            uv run python -m sab ai-brief-scheduled
            --market "${MARKET}"
            --schedule-role "${SCHEDULE_ROLE}"
            --runner-role "${RUNNER_ROLE}"
            --scheduled-tick "${SCHEDULED_TICK}"
            --attempt-id "${attempt_id}"
            --run-url "${run_url}"
          )
          if [[ -n "${SOURCE_PROVIDER}" && "${SOURCE_PROVIDER}" != "none" ]]; then
            cmd+=(--source-provider "${SOURCE_PROVIDER}")
          fi
          "${cmd[@]}"

  ai_brief:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up mise toolchain
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.16
          cache: true
          install_args: --locked
          working_directory: .

      - name: Restore uv cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('mise.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Resolve workflow inputs
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RAW_PROVIDER: ${{ github.event.inputs.provider }}
          RAW_MARKET: ${{ github.event.inputs.market }}
          RAW_UNIVERSE: ${{ github.event.inputs.universe }}
          RAW_ENTRY_MODE: ${{ github.event.inputs.entry_mode }}
          RAW_MODEL_PROVIDER: ${{ github.event.inputs.model_provider }}
          RAW_MODEL_NAME: ${{ github.event.inputs.model_name }}
          RAW_MODEL_TIMEOUT_SECONDS: ${{ github.event.inputs.model_timeout_seconds }}
          RAW_SOURCE_PROVIDER: ${{ github.event.inputs.source_provider }}
          RAW_SOURCE_REPORT_PATH: ${{ github.event.inputs.source_report_path }}
          RAW_SOURCE_API_URL: ${{ github.event.inputs.source_api_url }}
          RAW_SOURCE_TIMEOUT_SECONDS: ${{ github.event.inputs.source_timeout_seconds }}
          DEFAULT_SOURCE_PROVIDER: ${{ vars.AI_BRIEF_SOURCE_PROVIDER }}
          DEFAULT_SOURCE_PROVIDER_KR: ${{ vars.AI_BRIEF_SOURCE_PROVIDER_KR }}
          DEFAULT_SOURCE_PROVIDER_US: ${{ vars.AI_BRIEF_SOURCE_PROVIDER_US }}
          DEFAULT_SOURCE_API_URL: ${{ vars.AI_BRIEF_SOURCE_API_URL }}
          DEFAULT_SOURCE_API_URL_KR: ${{ vars.AI_BRIEF_SOURCE_API_URL_KR }}
          DEFAULT_SOURCE_API_URL_US: ${{ vars.AI_BRIEF_SOURCE_API_URL_US }}
          RAW_SEND_NOTIFICATIONS: ${{ github.event.inputs.send_notifications }}
        run: |
          set -euo pipefail

          is_schedule="false"
          scheduled_market=""
          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            is_schedule="true"
            case "${EVENT_SCHEDULE}" in
              "30 22 * * 0-4") scheduled_market="KR" ;;
              "7 12 * * 1-5") scheduled_market="US" ;;
              *)
                echo "Unsupported AI brief schedule: ${EVENT_SCHEDULE}" >&2
                exit 1
                ;;
            esac
          fi

          provider="${RAW_PROVIDER}"
          if [[ "${is_schedule}" == "true" ]]; then
            provider="kis"
          elif [[ -z "${provider}" ]]; then
            provider="kis"
          fi
          provider="${provider,,}"
          case "${provider}" in
            kis|pykrx) ;;
            *)
              echo "Unsupported provider: ${provider}" >&2
              exit 1
              ;;
          esac

          market="${RAW_MARKET}"
          if [[ "${is_schedule}" == "true" ]]; then
            market="${scheduled_market}"
          elif [[ -z "${market}" ]]; then
            market="KR"
          fi
          market="${market^^}"
          case "${market}" in
            KR|US) ;;
            *)
              echo "Unsupported market: ${market}" >&2
              exit 1
              ;;
          esac

          universe="${RAW_UNIVERSE}"
          if [[ "${is_schedule}" == "true" ]]; then
            universe="both"
          elif [[ -z "${universe}" ]]; then
            universe="both"
          fi
          universe="${universe,,}"
          case "${universe}" in
            watchlist|screener|both) ;;
            *)
              echo "Unsupported universe: ${universe}" >&2
              exit 1
              ;;
          esac

          entry_mode="${RAW_ENTRY_MODE}"
          if [[ "${is_schedule}" == "true" ]]; then
            entry_mode="PRE_OPEN"
          elif [[ -z "${entry_mode}" ]]; then
            entry_mode="PRE_OPEN"
          fi
          entry_mode="${entry_mode^^}"
          case "${entry_mode}" in
            PRE_OPEN|INTRADAY|AFTER_CLOSE) ;;
            *)
              echo "Unsupported entry_mode: ${entry_mode}" >&2
              exit 1
              ;;
          esac

          model_provider="${RAW_MODEL_PROVIDER}"
          if [[ "${is_schedule}" == "true" ]]; then
            model_provider="openai"
          elif [[ -z "${model_provider}" ]]; then
            model_provider="fake"
          fi
          model_provider="${model_provider,,}"
          case "${model_provider}" in
            fake|openai) ;;
            *)
              echo "Unsupported model_provider: ${model_provider}" >&2
              exit 1
              ;;
          esac

          model_name="${RAW_MODEL_NAME}"
          if [[ -z "${model_name}" ]]; then
            model_name="fake-ai-brief-v1"
          fi
          if [[ "${model_name}" == *$'\n'* || "${model_name}" == *$'\r'* ]]; then
            echo "model_name must be a single-line value" >&2
            exit 1
          fi

          model_timeout_seconds="${RAW_MODEL_TIMEOUT_SECONDS}"
          if [[ "${model_timeout_seconds}" == *$'\n'* || "${model_timeout_seconds}" == *$'\r'* ]]; then
            echo "model_timeout_seconds must be a single-line value" >&2
            exit 1
          fi
          if [[ -n "${model_timeout_seconds}" ]]; then
            MODEL_TIMEOUT_SECONDS="${model_timeout_seconds}" python - <<'PY'
          import math
          import os

          value = os.environ["MODEL_TIMEOUT_SECONDS"]
          try:
              parsed = float(value)
          except ValueError as exc:
              raise SystemExit(f"model_timeout_seconds must be numeric: {value!r}") from exc
          if not math.isfinite(parsed) or parsed <= 0:
              raise SystemExit("model_timeout_seconds must be positive")
          PY
          fi

          default_source_provider="${DEFAULT_SOURCE_PROVIDER,,}"
          market_default_source_provider=""
          market_default_source_api_url=""
          case "${market}" in
            KR)
              market_default_source_provider="${DEFAULT_SOURCE_PROVIDER_KR,,}"
              market_default_source_api_url="${DEFAULT_SOURCE_API_URL_KR}"
              ;;
            US)
              market_default_source_provider="${DEFAULT_SOURCE_PROVIDER_US,,}"
              market_default_source_api_url="${DEFAULT_SOURCE_API_URL_US}"
              ;;
          esac

          source_provider="${RAW_SOURCE_PROVIDER}"
          if [[ "${is_schedule}" == "true" ]]; then
            if [[ -n "${market_default_source_provider}" ]]; then
              source_provider="${market_default_source_provider}"
            elif [[ -n "${default_source_provider}" ]]; then
              source_provider="${default_source_provider}"
            elif [[ -n "${market_default_source_api_url}" || -n "${DEFAULT_SOURCE_API_URL}" ]]; then
              source_provider="http-json"
            else
              source_provider="none"
            fi
          elif [[ -z "${source_provider}" ]]; then
            source_provider="none"
          fi
          source_provider="${source_provider,,}"
          case "${source_provider}" in
            none|local-json|http-json|finnhub|polygon-news|alpha-vantage-news|marketaux-news|benzinga-news|naver-news) ;;
            *)
              echo "Unsupported source_provider: ${source_provider}" >&2
              exit 1
              ;;
          esac

          source_report_path="${RAW_SOURCE_REPORT_PATH}"
          if [[ "${is_schedule}" == "true" ]]; then
            source_report_path=""
          fi
          if [[ "${source_report_path}" == *$'\n'* || "${source_report_path}" == *$'\r'* ]]; then
            echo "source_report_path must be a single-line value" >&2
            exit 1
          fi
          if [[ "${source_provider}" == "local-json" && -z "${source_report_path}" ]]; then
            echo "source_provider=local-json requires source_report_path" >&2
            exit 1
          fi

          source_api_url="${RAW_SOURCE_API_URL}"
          if [[ "${is_schedule}" == "true" && "${source_provider}" == "http-json" && -z "${source_api_url}" ]]; then
            if [[ -n "${market_default_source_api_url}" ]]; then
              source_api_url="${market_default_source_api_url}"
            else
              source_api_url="${DEFAULT_SOURCE_API_URL}"
            fi
          elif [[ "${is_schedule}" == "true" && "${source_provider}" != "http-json" ]]; then
            source_api_url=""
          fi
          if [[ "${source_api_url}" == *$'\n'* || "${source_api_url}" == *$'\r'* ]]; then
            echo "source_api_url must be a single-line value" >&2
            exit 1
          fi
          if [[ "${source_provider}" == "http-json" && -z "${source_api_url}" ]]; then
            echo "source_provider=http-json requires source_api_url" >&2
            exit 1
          fi

          source_timeout_seconds="${RAW_SOURCE_TIMEOUT_SECONDS}"
          if [[ "${source_timeout_seconds}" == *$'\n'* || "${source_timeout_seconds}" == *$'\r'* ]]; then
            echo "source_timeout_seconds must be a single-line value" >&2
            exit 1
          fi
          if [[ -n "${source_timeout_seconds}" ]]; then
            SOURCE_TIMEOUT_SECONDS="${source_timeout_seconds}" python - <<'PY'
          import math
          import os

          value = os.environ["SOURCE_TIMEOUT_SECONDS"]
          try:
              parsed = float(value)
          except ValueError as exc:
              raise SystemExit(f"source_timeout_seconds must be numeric: {value!r}") from exc
          if not math.isfinite(parsed) or parsed <= 0:
              raise SystemExit("source_timeout_seconds must be positive")
          PY
          fi

          send_notifications="${RAW_SEND_NOTIFICATIONS}"
          if [[ "${is_schedule}" == "true" ]]; then
            send_notifications="true"
          elif [[ -z "${send_notifications}" ]]; then
            send_notifications="false"
          fi
          send_notifications="${send_notifications,,}"
          case "${send_notifications}" in
            true|false) ;;
            *)
              echo "Unsupported send_notifications: ${send_notifications}" >&2
              exit 1
              ;;
          esac

          if [[ "${provider}" == "pykrx" ]]; then
            if [[ "${market}" != "KR" ]]; then
              echo "provider=pykrx supports only market=KR; got market=${market}" >&2
              exit 1
            fi
            if [[ "${entry_mode}" != "AFTER_CLOSE" ]]; then
              echo "provider=pykrx requires entry_mode=AFTER_CLOSE" >&2
              exit 1
            fi
            if [[ "${universe}" != "watchlist" ]]; then
              echo "provider=pykrx requires universe=watchlist" >&2
              exit 1
            fi
          fi

          {
            echo "is_schedule=${is_schedule}"
            echo "scheduled_market=${scheduled_market}"
            echo "provider=${provider}"
            echo "market=${market}"
            echo "universe=${universe}"
            echo "entry_mode=${entry_mode}"
            echo "model_provider=${model_provider}"
            echo "model_name=${model_name}"
            echo "model_timeout_seconds=${model_timeout_seconds}"
            echo "source_provider=${source_provider}"
            echo "source_report_path=${source_report_path}"
            echo "source_api_url=${source_api_url}"
            echo "source_timeout_seconds=${source_timeout_seconds}"
            echo "send_notifications=${send_notifications}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check scheduled runtime guard
        id: schedule_guard
        if: github.event_name == 'schedule'
        env:
          SCHEDULED_MARKET: ${{ steps.params.outputs.scheduled_market }}
          SCHEDULED_ENTRY_MODE: ${{ steps.params.outputs.entry_mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import os
          from zoneinfo import ZoneInfo

          from sab.data.trading_sessions import is_trading_session
          from sab.report.session_state import resolve_run_session_state_map

          market = os.environ["SCHEDULED_MARKET"]
          expected_state = os.environ["SCHEDULED_ENTRY_MODE"]
          zone_name = "Asia/Seoul" if market == "KR" else "America/New_York"
          now = dt.datetime.now(dt.UTC)
          local_now = now.astimezone(ZoneInfo(zone_name))
          local_time = local_now.isoformat()
          session_date = local_now.date()
          state_map = resolve_run_session_state_map(
              markets=[market],
              data_dir="data",
              now=now,
          )
          session_state = state_map.get(market, "AFTER_CLOSE")
          trading_session = is_trading_session(
              session_date,
              market=market,
              data_dir="data",
          )
          should_run = trading_session and session_state == expected_state

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"should_run={str(should_run).lower()}\n")
              out.write(f"session_state={session_state}\n")
              out.write(f"session_date={session_date.isoformat()}\n")
              out.write(f"trading_session={str(trading_session).lower()}\n")
              out.write(f"local_time={local_time}\n")

          if should_run:
              print(
                  "Scheduled AI brief guard passed: "
                  f"market={market} state={session_state} date={session_date}"
              )
          else:
              print(
                  "Skipping scheduled AI brief: "
                  f"market={market} state={session_state} "
                  f"date={session_date} trading_session={trading_session} "
                  f"local_time={local_time}"
              )
          PY

      - name: Build skipped scheduled notification
        if: github.event_name == 'schedule' && steps.schedule_guard.outputs.should_run != 'true'
        env:
          MARKET: ${{ steps.params.outputs.market }}
          SESSION_STATE: ${{ steps.schedule_guard.outputs.session_state }}
          SESSION_DATE: ${{ steps.schedule_guard.outputs.session_date }}
          TRADING_SESSION: ${{ steps.schedule_guard.outputs.trading_session }}
          EXPECTED_STATE: ${{ steps.params.outputs.entry_mode }}
          LOCAL_TIME: ${{ steps.schedule_guard.outputs.local_time }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from sab.report.notification_text import build_ai_brief_skipped_telegram_text

          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          text = build_ai_brief_skipped_telegram_text(
              market=os.environ["MARKET"],
              session_state=os.environ["SESSION_STATE"],
              session_date=os.environ["SESSION_DATE"],
              expected_state=os.environ["EXPECTED_STATE"],
              local_time=os.environ["LOCAL_TIME"],
              trading_session=os.environ["TRADING_SESSION"],
              run_url=run_url,
          )
          Path("ai-brief.skipped.telegram.txt").write_text(
              text,
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### AI Brief skipped\n\n")
              out.write("```text\n")
              out.write(text)
              out.write("\n```\n")
          PY

      - name: Send skipped Telegram notification
        if: github.event_name == 'schedule' && steps.schedule_guard.outputs.should_run != 'true' && steps.params.outputs.send_notifications == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@ai-brief.skipped.telegram.txt" \
            -d disable_web_page_preview=true

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ steps.params.outputs.provider }}" == "pykrx" ]]; then
            uv sync --locked --all-groups --extra pykrx
          else
            uv sync --locked --all-groups
          fi

      - name: Ensure watchlist file
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          if [[ ! -f watchlist.txt ]]; then
            : > watchlist.txt
            echo "Created empty watchlist.txt for AI brief workflow baseline."
          fi

      - name: Validate pykrx watchlist
        if: (github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true') && steps.params.outputs.provider == 'pykrx'
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from sab.config import load_config, load_watchlist

          cfg = load_config(provider_override="pykrx")
          watchlist_path = cfg.watchlist_path or "watchlist.txt"
          tickers = load_watchlist(watchlist_path)
          if not tickers:
              raise SystemExit(
                  "provider=pykrx requires a non-empty watchlist. "
                  f"Add at least one ticker to '{watchlist_path}' "
                  "or set WATCHLIST_FILE/files.watchlist."
              )
          print(
              f"pykrx watchlist preflight passed: {len(tickers)} ticker(s) from {watchlist_path}"
          )
          PY

      - name: Run scan
        id: run_scan
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports

          set +e
          uv run -m sab scan \
            --provider "${{ steps.params.outputs.provider }}" \
            --markets "${{ steps.params.outputs.market }}" \
            --universe "${{ steps.params.outputs.universe }}" 2>&1 | tee scan.log
          scan_status=${PIPESTATUS[0]}
          set -e

          buy_report_path="$(sed -n 's/.*Buy report written to: //p' scan.log | tail -n 1 | tr -d '\r')"
          if [[ -z "${buy_report_path}" ]]; then
            buy_report_path="$(python - <<'PY'
          from pathlib import Path

          paths = sorted(
              Path("reports").glob("*.buy.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          print(paths[0] if paths else "")
          PY
          )"
          fi

          if [[ -z "${buy_report_path}" || ! -f "${buy_report_path}" ]]; then
            echo "Buy report (*.buy.json) not found under reports/" >&2
            exit 1
          fi

          allow_empty_scan="false"
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            if grep -Fq "No tickers provided (watchlist empty or missing)" scan.log; then
              allow_empty_scan="true"
              echo "Scheduled scan produced no tickers; continuing with empty buy report."
            fi
          fi
          if [[ "${scan_status}" -ne 0 && "${allow_empty_scan}" != "true" ]]; then
            exit "${scan_status}"
          fi

          echo "buy_report_path=${buy_report_path}" >> "${GITHUB_OUTPUT}"

      - name: Load holdings from Supabase
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          supabase_key="${SUPABASE_SECRET_KEY:-}"
          if [[ -z "${supabase_key}" ]]; then
            echo "SUPABASE_SECRET_KEY must be set." >&2
            exit 1
          fi
          if [[ "${supabase_key}" == sb_publishable_* ]]; then
            echo "Publishable key is not allowed for server-side workflow jobs." >&2
            exit 1
          fi

          base_url="${SUPABASE_URL%/}"
          query="select=ticker,quantity,entry_price,entry_currency,entry_date,strategy,notes,tags,stop_override,target_override&quantity=gt.0&order=ticker.asc"

          curl -fsS "${base_url}/rest/v1/holdings?${query}" \
            -H "apikey: ${supabase_key}" \
            -H "Authorization: Bearer ${supabase_key}" \
            -H "Accept: application/json" \
            > holdings.supabase.json

          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("holdings.supabase.json").read_text(encoding="utf-8"))
          if not isinstance(raw, list):
              raise SystemExit("Supabase holdings response must be a JSON array")

          payload: dict[str, list[dict[str, object]]] = {"holdings": []}
          keys = (
              "quantity",
              "entry_price",
              "entry_currency",
              "entry_date",
              "strategy",
              "notes",
              "tags",
              "stop_override",
              "target_override",
          )

          for row in raw:
              if not isinstance(row, dict):
                  continue
              ticker = str(row.get("ticker") or "").strip()
              if not ticker:
                  continue
              item: dict[str, object] = {"ticker": ticker}
              for key in keys:
                  value = row.get(key)
                  if value is None:
                      continue
                  item[key] = value
              payload["holdings"].append(item)

          out_path = Path("holdings.yaml")
          out_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Prepared {len(payload['holdings'])} holdings to {out_path}")
          PY

      - name: Run entry
        id: run_entry
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          entry_reports_before="$(uv run python - <<'PY'
          from pathlib import Path

          from sab.config import load_config

          report_dir = Path(load_config().report_dir)
          for path in sorted(report_dir.glob("*.entry.json")):
              print(path.as_posix())
          PY
          )"

          set +e
          uv run -m sab entry \
            --provider "${{ steps.params.outputs.provider }}" \
            --mode "${{ steps.params.outputs.entry_mode }}" \
            --market "${{ steps.params.outputs.market }}" \
            --buy-report "${{ steps.run_scan.outputs.buy_report_path }}" \
            --upload 2>&1 | tee entry.log
          entry_status=${PIPESTATUS[0]}
          set -e

          entry_report_path="$(sed -n 's/.*Entry report written to: //p' entry.log | tail -n 1 | tr -d '\r')"
          if [[ -z "${entry_report_path}" ]]; then
            entry_report_path="$(ENTRY_REPORTS_BEFORE="${entry_reports_before}" uv run python - <<'PY'
          import os
          from pathlib import Path

          from sab.config import load_config

          before = set(os.environ["ENTRY_REPORTS_BEFORE"].splitlines())
          report_dir = Path(load_config().report_dir)
          paths = sorted(
              (
                  p
                  for p in report_dir.glob("*.entry.json")
                  if p.as_posix() not in before
              ),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          print(paths[0] if paths else "")
          PY
          )"
          fi

          ENTRY_STATUS="${entry_status}" uv run python - <<'PY'
          import os

          entry_status = os.environ["ENTRY_STATUS"]
          if not entry_status.isdecimal():
              raise SystemExit("entry_status must be a non-negative integer")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"entry_status={entry_status}\n")
          PY
          if [[ -z "${entry_report_path}" || ! -f "${entry_report_path}" ]]; then
            echo "Entry report (*.entry.json) not found" >&2
            exit 1
          fi

          ENTRY_REPORT_PATH="${entry_report_path}" uv run python - <<'PY'
          import os
          from pathlib import Path, PurePosixPath

          from sab.config import load_config

          entry_report_path = os.environ["ENTRY_REPORT_PATH"]
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._-/")
          report_dir = PurePosixPath(Path(load_config().report_dir).as_posix())
          path = PurePosixPath(entry_report_path)
          if (
              not str(report_dir)
              or "\\" in str(report_dir)
              or any(char not in allowed for char in str(report_dir))
              or report_dir.is_absolute()
              or ".." in report_dir.parts
          ):
              raise SystemExit("configured report_dir must be a safe relative path")
          if (
              not entry_report_path
              or "\\" in entry_report_path
              or any(char not in allowed for char in entry_report_path)
              or entry_report_path != path.as_posix()
              or path.is_absolute()
              or ".." in path.parts
              or len(path.parts) <= len(report_dir.parts)
              or path.parts[: len(report_dir.parts)] != report_dir.parts
              or not path.name.endswith(".entry.json")
          ):
              raise SystemExit(
                  "entry_report_path must be a safe relative path ending with .entry.json"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"entry_report_path={entry_report_path}\n")
          PY
          if [[ "${entry_status}" -ne 0 ]]; then
            exit "${entry_status}"
          fi

      - name: Upload fatal entry artifact
        if: failure() && steps.run_entry.outputs.entry_report_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-brief-entry-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run_entry.outputs.entry_report_path }}
          if-no-files-found: error

      - name: Run AI brief
        id: run_ai_brief
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_AI_BRIEF_MODEL: ${{ vars.OPENAI_AI_BRIEF_MODEL }}
          AI_BRIEF_MODEL_TIMEOUT_SECONDS: ${{ vars.AI_BRIEF_MODEL_TIMEOUT_SECONDS }}
          AI_BRIEF_SOURCE_API_URL: ${{ vars.AI_BRIEF_SOURCE_API_URL }}
          AI_BRIEF_SOURCE_API_URL_KR: ${{ vars.AI_BRIEF_SOURCE_API_URL_KR }}
          AI_BRIEF_SOURCE_API_URL_US: ${{ vars.AI_BRIEF_SOURCE_API_URL_US }}
          AI_BRIEF_SOURCE_API_TOKEN: ${{ steps.params.outputs.source_provider == 'http-json' && secrets.AI_BRIEF_SOURCE_API_TOKEN || '' }}
          AI_BRIEF_SOURCE_TIMEOUT_SECONDS: ${{ vars.AI_BRIEF_SOURCE_TIMEOUT_SECONDS }}
          FINNHUB_API_KEY: ${{ steps.params.outputs.source_provider == 'finnhub' && secrets.FINNHUB_API_KEY || '' }}
          POLYGON_API_KEY: ${{ steps.params.outputs.source_provider == 'polygon-news' && secrets.POLYGON_API_KEY || '' }}
          ALPHA_VANTAGE_API_KEY: ${{ steps.params.outputs.source_provider == 'alpha-vantage-news' && secrets.ALPHA_VANTAGE_API_KEY || '' }}
          MARKETAUX_API_TOKEN: ${{ steps.params.outputs.source_provider == 'marketaux-news' && secrets.MARKETAUX_API_TOKEN || '' }}
          BENZINGA_API_TOKEN: ${{ steps.params.outputs.source_provider == 'benzinga-news' && secrets.BENZINGA_API_TOKEN || '' }}
          NAVER_CLIENT_ID: ${{ steps.params.outputs.source_provider == 'naver-news' && secrets.NAVER_CLIENT_ID || '' }}
          NAVER_CLIENT_SECRET: ${{ steps.params.outputs.source_provider == 'naver-news' && secrets.NAVER_CLIENT_SECRET || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PARAM_MODEL_NAME: ${{ steps.params.outputs.model_name }}
          PARAM_MODEL_TIMEOUT_SECONDS: ${{ steps.params.outputs.model_timeout_seconds }}
          PARAM_SOURCE_PROVIDER: ${{ steps.params.outputs.source_provider }}
          PARAM_SOURCE_REPORT_PATH: ${{ steps.params.outputs.source_report_path }}
          PARAM_SOURCE_API_URL: ${{ steps.params.outputs.source_api_url }}
          PARAM_SOURCE_TIMEOUT_SECONDS: ${{ steps.params.outputs.source_timeout_seconds }}
        run: |
          set -euo pipefail

          cmd=(
            uv run -m sab ai-brief
            --entry-report "${{ steps.run_entry.outputs.entry_report_path }}"
            --buy-report "${{ steps.run_scan.outputs.buy_report_path }}"
            --market "${{ steps.params.outputs.market }}"
            --model-provider "${{ steps.params.outputs.model_provider }}"
            --model-name "${PARAM_MODEL_NAME}"
            --upload
          )
          if [[ -n "${PARAM_MODEL_TIMEOUT_SECONDS}" ]]; then
            cmd+=(--model-timeout-seconds "${PARAM_MODEL_TIMEOUT_SECONDS}")
          fi
          if [[ "${PARAM_SOURCE_PROVIDER}" != "none" ]]; then
            cmd+=(
              --source-provider "${PARAM_SOURCE_PROVIDER}"
            )
            if [[ "${PARAM_SOURCE_PROVIDER}" == "local-json" ]]; then
              cmd+=(--source-report "${PARAM_SOURCE_REPORT_PATH}")
            elif [[ "${PARAM_SOURCE_PROVIDER}" == "http-json" ]]; then
              cmd+=(--source-api-url "${PARAM_SOURCE_API_URL}")
            fi
            if [[ "${PARAM_SOURCE_PROVIDER}" == "http-json" || "${PARAM_SOURCE_PROVIDER}" == "finnhub" || "${PARAM_SOURCE_PROVIDER}" == "polygon-news" || "${PARAM_SOURCE_PROVIDER}" == "alpha-vantage-news" || "${PARAM_SOURCE_PROVIDER}" == "marketaux-news" || "${PARAM_SOURCE_PROVIDER}" == "benzinga-news" || "${PARAM_SOURCE_PROVIDER}" == "naver-news" ]]; then
              if [[ -n "${PARAM_SOURCE_TIMEOUT_SECONDS}" ]]; then
                cmd+=(--source-timeout-seconds "${PARAM_SOURCE_TIMEOUT_SECONDS}")
              fi
            fi
          fi

          source_api_token=""
          if [[ "${PARAM_SOURCE_PROVIDER}" == "http-json" ]]; then
            if [[ -n "${AI_BRIEF_SOURCE_API_URL}" && "${PARAM_SOURCE_API_URL}" == "${AI_BRIEF_SOURCE_API_URL}" ]]; then
              source_api_token="${AI_BRIEF_SOURCE_API_TOKEN:-}"
            elif [[ -n "${AI_BRIEF_SOURCE_API_URL_KR}" && "${PARAM_SOURCE_API_URL}" == "${AI_BRIEF_SOURCE_API_URL_KR}" ]]; then
              source_api_token="${AI_BRIEF_SOURCE_API_TOKEN:-}"
            elif [[ -n "${AI_BRIEF_SOURCE_API_URL_US}" && "${PARAM_SOURCE_API_URL}" == "${AI_BRIEF_SOURCE_API_URL_US}" ]]; then
              source_api_token="${AI_BRIEF_SOURCE_API_TOKEN:-}"
            elif [[ -n "${AI_BRIEF_SOURCE_API_TOKEN:-}" ]]; then
              echo "Source API token is not forwarded for custom source_api_url." >&2
            fi
          fi

          AI_BRIEF_SOURCE_API_TOKEN="${source_api_token}" "${cmd[@]}" 2>&1 | tee ai-brief.log

          ai_brief_report_path="$(sed -n 's/.*AI brief written to: //p' ai-brief.log | tail -n 1 | tr -d '\r')"
          if [[ -z "${ai_brief_report_path}" ]]; then
            ai_brief_report_path="$(python - <<'PY'
          from pathlib import Path

          paths = sorted(
              Path("reports").glob("*.ai-brief.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          print(paths[0] if paths else "")
          PY
          )"
          fi

          if [[ -z "${ai_brief_report_path}" || ! -f "${ai_brief_report_path}" ]]; then
            echo "AI brief report (*.ai-brief.json) not found under reports/" >&2
            exit 1
          fi

          echo "ai_brief_report_path=${ai_brief_report_path}" >> "${GITHUB_OUTPUT}"

      - name: Build notification preview
        if: github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true'
        env:
          REPORT_PATH: ${{ steps.run_ai_brief.outputs.ai_brief_report_path }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sab.report.notification_text import (
              build_ai_brief_slack_summary_text,
              build_ai_brief_telegram_report_text,
          )

          report_path = Path(os.environ["REPORT_PATH"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )

          Path("ai-brief.slack.txt").write_text(
              build_ai_brief_slack_summary_text(
                  report=report,
                  repo=repo,
                  run_url=run_url,
              ),
              encoding="utf-8",
          )
          Path("ai-brief.telegram.txt").write_text(
              build_ai_brief_telegram_report_text(
                  report=report,
                  run_url=run_url,
                  max_items=5,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload generated AI brief artifacts
        if: success() && (github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ai-brief-report-${{ github.run_id }}
          path: |
            ${{ steps.run_scan.outputs.buy_report_path }}
            ${{ steps.run_entry.outputs.entry_report_path }}
            ${{ steps.run_ai_brief.outputs.ai_brief_report_path }}
            ai-brief.slack.txt
            ai-brief.telegram.txt
          if-no-files-found: error

      - name: Send Telegram notification
        if: success() && (github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true') && steps.params.outputs.send_notifications == 'true'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text@ai-brief.telegram.txt" \
            -d disable_web_page_preview=true

      - name: Send Slack notification
        if: success() && (github.event_name != 'schedule' || steps.schedule_guard.outputs.should_run == 'true') && steps.params.outputs.send_notifications == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "Slack webhook not set; skipping."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          payload = json.dumps(
              {"text": Path("ai-brief.slack.txt").read_text(encoding="utf-8")}
          ).encode("utf-8")
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              if resp.status >= 300:
                  raise RuntimeError(f"Slack webhook returned HTTP {resp.status}")
          PY
