name: Sync mise.lock

on:
  pull_request:
    paths:
      - mise.toml
    types:
      - opened
      - synchronize

concurrency:
  group: mise-lock-sync-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: mise.lock sync
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up mise
        uses: jdx/mise-action@c1ecc8f748cd28cdeabf76dab3cccde4ce692fe4 # v4.0.0
        with:
          version: 2026.3.1
          install: false

      - name: Regenerate mise.lock
        run: mise lock --platform linux-x64,macos-arm64

      - name: Commit and push
        id: push
        run: |
          if git diff --quiet -- mise.lock; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "mise.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mise.lock
          git commit -m "chore(toolchain): mise.lock 자동 동기화"
          git push
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Re-trigger CI
        if: steps.push.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          gh run list \
            --branch "$HEAD_REF" \
            --workflow ci.yml \
            --status in_progress \
            --json databaseId \
            --jq '.[].databaseId' \
          | while read -r id; do
              gh run cancel "$id" 2>/dev/null || true
            done
          gh workflow run ci.yml --ref "$HEAD_REF"
