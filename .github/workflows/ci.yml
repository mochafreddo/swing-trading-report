name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Ruff + Mypy + Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy sab

      - name: Pytest
        run: uv run python -m pytest -q

      - name: CLI smoke test
        run: uv run -m sab --help

  web:
    name: Next.js Web (Lint + Typecheck + Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node.js version from Dockerfile
        id: resolve-node-version
        run: |
          set -euo pipefail

          from_line="$(grep -m1 -E '^[[:space:]]*FROM[[:space:]]+node:' Dockerfile || true)"
          if [[ -z "${from_line}" ]]; then
            echo "::error title=Node version resolve failed::Cannot find 'FROM node:' in web/Dockerfile"
            exit 1
          fi

          node_tag="${from_line#*node:}"
          node_tag="${node_tag%%[[:space:]]*}"

          if [[ "${node_tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            node_version="${BASH_REMATCH[1]}"
          else
            echo "::error title=Node version resolve failed::Expected semver prefix in Docker image tag, got '${node_tag}'"
            exit 1
          fi

          if [[ -z "${node_version}" ]]; then
            echo "::error title=Node version resolve failed::Resolved Node version is empty"
            exit 1
          fi

          echo "version=${node_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.resolve-node-version.outputs.version }}
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Log Node.js version
        run: |
          echo "Resolved Node.js version: ${{ steps.resolve-node-version.outputs.version }}"
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
