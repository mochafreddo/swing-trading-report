name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Ruff + Mypy + Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --config-file pyproject.toml

      - name: Pytest (coverage gate)
        run: uv run python -m pytest -q --cov=sab --cov-report=term --cov-fail-under=70

      - name: CLI smoke test
        run: uv run -m sab --help

  web:
    name: Next.js Web (Lint + Typecheck + Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAB_BASIC_AUTH_USER: ci-user
      SAB_BASIC_AUTH_PASS: ci-pass
      SAB_SESSION_SECRET: ci_session_secret_0123456789abcdef
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci
      GITHUB_OWNER: ci-owner
      GITHUB_REPO: ci-repo
      GITHUB_PAT: ghp_ci_token
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve Node.js version from Dockerfiles
        id: resolve-node-version
        run: |
          set -euo pipefail

          extract_node_version() {
            local dockerfile="$1"
            local from_line
            local node_tag

            from_line="$(grep -m1 -E '^[[:space:]]*FROM[[:space:]]+node:' "${dockerfile}" || true)"
            if [[ -z "${from_line}" ]]; then
              echo "::error title=Node version resolve failed::Cannot find 'FROM node:' in web/${dockerfile}" >&2
              return 1
            fi

            node_tag="${from_line#*node:}"
            node_tag="${node_tag%%[[:space:]]*}"

            if [[ "${node_tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              echo "${BASH_REMATCH[1]}"
              return 0
            fi

            echo "::error title=Node version resolve failed::Expected semver prefix in web/${dockerfile}, got '${node_tag}'" >&2
            return 1
          }

          node_version="$(extract_node_version Dockerfile)"
          node_version_dev="$(extract_node_version Dockerfile.dev)"

          if [[ "${node_version}" != "${node_version_dev}" ]]; then
            echo "::error title=Node version mismatch::web/Dockerfile(${node_version}) and web/Dockerfile.dev(${node_version_dev}) must match" >&2
            exit 1
          fi

          if [[ -z "${node_version}" ]]; then
            echo "::error title=Node version resolve failed::Resolved Node version is empty" >&2
            exit 1
          fi

          echo "version=${node_version}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.resolve-node-version.outputs.version }}
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Log Node.js version
        run: |
          echo "Resolved Node.js version: ${{ steps.resolve-node-version.outputs.version }}"
          node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (coverage gate)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
