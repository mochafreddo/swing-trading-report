name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Ruff + Mypy + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise toolchain
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.6.2
        with:
          version: 2026.3.1
          cache: true
          install_args: --locked
          working_directory: .

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('mise.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy --config-file pyproject.toml

      - name: Pytest (coverage gate)
        run: uv run python -m pytest -q --cov=sab --cov-report=term --cov-fail-under=70

      - name: CLI smoke test
        run: uv run -m sab --help

  web:
    name: Next.js Web (Lint + Typecheck + Test + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAB_BASIC_AUTH_USER: ci-user
      SAB_BASIC_AUTH_PASS: ci-pass
      SAB_SESSION_SECRET: ci_session_secret_0123456789abcdef
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci
      GITHUB_OWNER: ci-owner
      GITHUB_REPO: ci-repo
      GITHUB_PAT: ghp_ci_token
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise toolchain
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.6.2
        with:
          version: 2026.3.1
          cache: true
          install_args: --locked
          working_directory: .

      - name: Validate toolchain versions (lockfile/Dockerfile/package.json)
        run: |
          set -euo pipefail

          if [[ ! -f ../mise.lock ]]; then
            echo "::error title=Toolchain validation failed::Missing repository-level mise.lock. Run 'mise install' and commit the lockfile." >&2
            exit 1
          fi

          extract_node_version() {
            local dockerfile="$1"
            local from_line
            local node_tag

            from_line="$(grep -m1 -E '^[[:space:]]*FROM[[:space:]]+node:' "${dockerfile}" || true)"
            if [[ -z "${from_line}" ]]; then
              echo "::error title=Node version resolve failed::Cannot find 'FROM node:' in web/${dockerfile}" >&2
              return 1
            fi

            node_tag="${from_line#*node:}"
            node_tag="${node_tag%%[[:space:]]*}"

            if [[ "${node_tag}" =~ ^([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              echo "${BASH_REMATCH[1]}"
              return 0
            fi

            echo "::error title=Node version resolve failed::Expected semver prefix in web/${dockerfile}, got '${node_tag}'" >&2
            return 1
          }

          if ! command -v jq >/dev/null 2>&1; then
            echo "::error title=Toolchain validation failed::jq is required to parse web/package.json" >&2
            exit 1
          fi

          docker_node_version="$(extract_node_version Dockerfile)"
          docker_node_version_dev="$(extract_node_version Dockerfile.dev)"
          installed_node_version="$(node --version | sed 's/^v//')"
          installed_pnpm_version="$(pnpm --version)"

          if [[ "${docker_node_version}" != "${docker_node_version_dev}" ]]; then
            echo "::error title=Node version mismatch::web/Dockerfile(${docker_node_version}) and web/Dockerfile.dev(${docker_node_version_dev}) must match" >&2
            exit 1
          fi

          if [[ "${installed_node_version}" != "${docker_node_version}" ]]; then
            echo "::error title=Node version mismatch::Installed node(${installed_node_version}) and web/Dockerfile node(${docker_node_version}) must match" >&2
            exit 1
          fi

          package_manager="$(jq -r '.packageManager // empty' package.json)"
          if [[ -z "${package_manager}" ]]; then
            echo "::error title=Toolchain validation failed::Missing 'packageManager' in web/package.json" >&2
            exit 1
          fi

          if [[ "${package_manager}" =~ ^pnpm@([0-9]+\.[0-9]+\.[0-9]+)(\+.+)?$ ]]; then
            package_json_pnpm_version="${BASH_REMATCH[1]}"
          else
            echo "::error title=Toolchain validation failed::Expected 'pnpm@<semver>' in web/package.json#packageManager, got '${package_manager}'" >&2
            exit 1
          fi

          if [[ "${installed_pnpm_version}" != "${package_json_pnpm_version}" ]]; then
            echo "::error title=pnpm version mismatch::Installed pnpm(${installed_pnpm_version}) and web/package.json packageManager(${package_json_pnpm_version}) must match" >&2
            exit 1
          fi

          if ! git diff --quiet -- ../mise.lock; then
            echo "::error title=Toolchain validation failed::mise.lock changed during CI setup. Run 'mise lock --platform linux-x64,macos-arm64 && mise install' locally and commit updated lockfile." >&2
            exit 1
          fi

          echo "Validated toolchain versions: node=${installed_node_version}, pnpm=${installed_pnpm_version}"

      - name: Log toolchain versions
        run: |
          mise --version
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (coverage gate)
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
