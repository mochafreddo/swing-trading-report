name: Report cleanup

on:
  schedule:
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (no delete)"
        required: false
        default: true
        type: boolean
      retention_days:
        description: "Retention days (>0)"
        required: false
        default: "30"
        type: string
      bucket:
        description: "Supabase Storage bucket"
        required: false
        default: "reports"
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise toolchain
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.6.2
        with:
          version: 2026.3.1
          cache: true
          install_args: --locked
          working_directory: .

      - name: Resolve cleanup inputs
        id: params
        run: |
          set -euo pipefail

          dry_run="${{ github.event.inputs.dry_run }}"
          retention_days="${{ github.event.inputs.retention_days }}"
          bucket="${{ github.event.inputs.bucket }}"

          if [[ -z "${dry_run}" ]]; then
            dry_run="true"
          fi
          if [[ -z "${retention_days}" ]]; then
            retention_days="30"
          fi
          if [[ -z "${bucket}" ]]; then
            bucket="reports"
          fi

          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            dry_run="false"
          fi

          dry_run="${dry_run,,}"
          if [[ "${dry_run}" != "true" && "${dry_run}" != "false" ]]; then
            echo "dry_run must be true/false, got '${dry_run}'" >&2
            exit 1
          fi

          if ! [[ "${retention_days}" =~ ^[0-9]+$ ]] || [[ "${retention_days}" -le 0 ]]; then
            echo "retention_days must be a positive integer, got '${retention_days}'" >&2
            exit 1
          fi

          {
            echo "dry_run=${dry_run}"
            echo "retention_days=${retention_days}"
            echo "bucket=${bucket}"
          } >> "${GITHUB_OUTPUT}"

      - name: Cleanup expired report objects
        id: cleanup
        env:
          DRY_RUN: ${{ steps.params.outputs.dry_run }}
          RETENTION_DAYS: ${{ steps.params.outputs.retention_days }}
          BUCKET: ${{ steps.params.outputs.bucket }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          from sab.report.retention import (
              extract_report_date_from_key,
              select_expired_report_keys,
          )

          supabase_url = (os.environ.get("SUPABASE_URL") or "").strip().rstrip("/")
          if not supabase_url:
              raise SystemExit("SUPABASE_URL must be set")

          supabase_key = (os.environ.get("SUPABASE_SECRET_KEY") or "").strip()
          if not supabase_key:
              raise SystemExit("SUPABASE_SECRET_KEY must be set")
          if supabase_key.startswith("sb_publishable_"):
              raise SystemExit(
                  "Publishable key is not allowed for server-side cleanup workflow"
              )

          bucket = (os.environ.get("BUCKET") or "reports").strip()
          retention_days = int(os.environ["RETENTION_DAYS"])
          dry_run = (os.environ.get("DRY_RUN") or "true").strip().lower() == "true"
          index_cleanup_enabled = bucket == "reports"

          headers = {
              "apikey": supabase_key,
              "Authorization": f"Bearer {supabase_key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          def request_json(
              *,
              method: str,
              url: str,
              payload: object | None,
              extra_headers: dict[str, str] | None = None,
          ) -> object:
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              request_headers = headers.copy()
              if extra_headers:
                  request_headers.update(extra_headers)
              request = Request(url, data=data, method=method, headers=request_headers)
              try:
                  with urlopen(request, timeout=15) as response:
                      body = response.read().decode("utf-8")
              except HTTPError as exc:
                  message = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{method} {url} failed ({exc.code}): {message}") from exc
              except URLError as exc:
                  raise SystemExit(f"{method} {url} failed: {exc}") from exc

              if not body.strip():
                  return None
              try:
                  return json.loads(body)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      f"{method} {url} returned non-JSON response: {body[:200]}"
                  ) from exc

          encoded_bucket = quote(bucket, safe="")
          list_url = f"{supabase_url}/storage/v1/object/list/{encoded_bucket}"
          collected_keys: set[str] = set()
          prefixes_to_visit: list[str] = [""]
          visited_prefixes: set[str] = set()
          limit = 1000

          while prefixes_to_visit:
              prefix = prefixes_to_visit.pop()
              if prefix in visited_prefixes:
                  continue
              visited_prefixes.add(prefix)

              offset = 0
              while True:
                  payload = {
                      "prefix": prefix,
                      "limit": limit,
                      "offset": offset,
                      "sortBy": {"column": "name", "order": "asc"},
                  }
                  response_data = request_json(
                      method="POST",
                      url=list_url,
                      payload=payload,
                  )
                  if not isinstance(response_data, list):
                      raise SystemExit("Supabase list API response must be a JSON array")

                  for row in response_data:
                      if not isinstance(row, dict):
                          continue
                      name = row.get("name")
                      if not isinstance(name, str):
                          continue

                      stripped_name = name.strip()
                      if not stripped_name:
                          continue

                      full_name = (
                          stripped_name
                          if prefix and stripped_name.startswith(prefix)
                          else f"{prefix}{stripped_name}"
                      )

                      if stripped_name.endswith(".json"):
                          collected_keys.add(full_name)
                          continue

                      if "." not in stripped_name:
                          prefixes_to_visit.append(f"{full_name}/")

                  if len(response_data) < limit:
                      break
                  offset += limit

          all_keys = sorted(collected_keys)

          pattern_matched_count = sum(
              1 for key in all_keys if extract_report_date_from_key(key) is not None
          )
          today_utc = dt.datetime.now(dt.UTC).date()
          expired_keys = select_expired_report_keys(
              all_keys,
              retention_days=retention_days,
              today=today_utc,
          )
          storage_key_set = set(all_keys)

          index_expired_keys: list[str] = []
          if index_cleanup_enabled:
              cutoff_date = today_utc - dt.timedelta(days=retention_days)
              report_index_limit = 1000
              report_index_offset = 0
              while True:
                  report_index_query = urlencode(
                      {
                          "select": "report_key",
                          "report_date": f"lt.{cutoff_date.isoformat()}",
                          "order": "report_date.asc,duplicate_index.asc,report_key.asc",
                          "limit": str(report_index_limit),
                          "offset": str(report_index_offset),
                      }
                  )
                  report_index_url = f"{supabase_url}/rest/v1/report_index?{report_index_query}"
                  report_index_response = request_json(
                      method="GET",
                      url=report_index_url,
                      payload=None,
                  )
                  if not isinstance(report_index_response, list):
                      raise SystemExit(
                          "Supabase report_index list API response must be a JSON array"
                      )

                  for row in report_index_response:
                      if not isinstance(row, dict):
                          continue
                      report_key = row.get("report_key")
                      if not isinstance(report_key, str):
                          continue
                      stripped_report_key = report_key.strip()
                      if stripped_report_key:
                          index_expired_keys.append(stripped_report_key)

                  if len(report_index_response) < report_index_limit:
                      break
                  report_index_offset += report_index_limit

          dangling_index_keys = sorted(
              key for key in set(index_expired_keys) if key not in storage_key_set
          )
          index_keys_to_delete = sorted(set(expired_keys) | set(dangling_index_keys))

          def build_report_key_in_filter(keys: list[str]) -> str:
              escaped_keys: list[str] = []
              for key in keys:
                  escaped_key = key.replace("\\", "\\\\").replace('"', '\\"')
                  escaped_keys.append(f'"{escaped_key}"')
              return f"in.({','.join(escaped_keys)})"

          storage_deleted_count = 0
          index_deleted_count = 0
          index_deleted_unknown_count = 0
          if not dry_run and expired_keys:
              delete_url = f"{supabase_url}/storage/v1/object/{encoded_bucket}"
              chunk_size = 100
              for start in range(0, len(expired_keys), chunk_size):
                  chunk = expired_keys[start : start + chunk_size]
                  result = request_json(
                      method="DELETE",
                      url=delete_url,
                      payload={"prefixes": chunk},
                  )
                  if isinstance(result, list):
                      storage_deleted_count += len(result)
                  else:
                      storage_deleted_count += len(chunk)

          if not dry_run and index_cleanup_enabled and index_keys_to_delete:
              chunk_size = 50
              for start in range(0, len(index_keys_to_delete), chunk_size):
                  chunk = index_keys_to_delete[start : start + chunk_size]
                  key_filter = build_report_key_in_filter(chunk)
                  query = urlencode({"report_key": key_filter})
                  delete_index_url = f"{supabase_url}/rest/v1/report_index?{query}"
                  result = request_json(
                      method="DELETE",
                      url=delete_index_url,
                      payload=None,
                      extra_headers={"Prefer": "return=representation"},
                  )
                  if isinstance(result, list):
                      index_deleted_count += len(result)
                  else:
                      index_deleted_unknown_count += len(chunk)

          deleted_count = storage_deleted_count

          print("[cleanup] bucket=", bucket, sep="")
          print("[cleanup] dry_run=", str(dry_run).lower(), sep="")
          print("[cleanup] retention_days=", retention_days, sep="")
          print("[cleanup] listed_count=", len(all_keys), sep="")
          print("[cleanup] pattern_matched_count=", pattern_matched_count, sep="")
          print("[cleanup] expired_count=", len(expired_keys), sep="")
          print("[cleanup] deleted_count=", deleted_count, sep="")
          print("[cleanup] index_cleanup_enabled=", str(index_cleanup_enabled).lower(), sep="")
          print("[cleanup] index_expired_count=", len(set(index_expired_keys)), sep="")
          print("[cleanup] dangling_index_count=", len(dangling_index_keys), sep="")
          print("[cleanup] index_delete_target_count=", len(index_keys_to_delete), sep="")
          print("[cleanup] index_deleted_count=", index_deleted_count, sep="")
          print(
              "[cleanup] index_deleted_unknown_count=",
              index_deleted_unknown_count,
              sep="",
          )
          if not index_cleanup_enabled:
              print(
                  "[cleanup] report_index cleanup skipped because bucket is not 'reports'"
              )

          preview_limit = 20
          for key in expired_keys[:preview_limit]:
              print(f"[cleanup][expired] {key}")
          if len(expired_keys) > preview_limit:
              print(
                  "[cleanup][expired] ... "
                  f"{len(expired_keys) - preview_limit} more key(s) omitted"
              )
          for key in dangling_index_keys[:preview_limit]:
              print(f"[cleanup][dangling-index] {key}")
          if len(dangling_index_keys) > preview_limit:
              print(
                  "[cleanup][dangling-index] ... "
                  f"{len(dangling_index_keys) - preview_limit} more key(s) omitted"
              )

          output_path = os.environ.get("GITHUB_OUTPUT")
          if output_path:
              with open(output_path, "a", encoding="utf-8") as output:
                  output.write(f"bucket={bucket}\n")
                  output.write(f"dry_run={str(dry_run).lower()}\n")
                  output.write(f"retention_days={retention_days}\n")
                  output.write(f"listed_count={len(all_keys)}\n")
                  output.write(f"pattern_matched_count={pattern_matched_count}\n")
                  output.write(f"expired_count={len(expired_keys)}\n")
                  output.write(f"deleted_count={deleted_count}\n")
                  output.write(
                      f"index_cleanup_enabled={str(index_cleanup_enabled).lower()}\n"
                  )
                  output.write(f"index_expired_count={len(set(index_expired_keys))}\n")
                  output.write(f"dangling_index_count={len(dangling_index_keys)}\n")
                  output.write(f"index_delete_target_count={len(index_keys_to_delete)}\n")
                  output.write(f"index_deleted_count={index_deleted_count}\n")
                  output.write(
                      f"index_deleted_unknown_count={index_deleted_unknown_count}\n"
                  )
          PY
