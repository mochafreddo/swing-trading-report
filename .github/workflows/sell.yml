name: Sell pipeline

on:
  schedule:
    # Weekdays at 22:20 UTC (adjust to your market/strategy cadence)
    - cron: "20 22 * * 1-5"
  workflow_dispatch:
    inputs:
      provider:
        description: "Data provider"
        required: false
        default: kis
        type: choice
        options:
          - kis
          - pykrx

concurrency:
  group: sell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  sell:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise toolchain
        uses: jdx/mise-action@e79ddf65a11cec7b0e882bedced08d6e976efb2d # v3.6.2
        with:
          version: 2026.3.1
          cache: true
          install_args: --locked
          working_directory: .

      - name: Restore uv cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('mise.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Resolve workflow inputs
        id: params
        run: |
          set -euo pipefail
          provider="${{ github.event.inputs.provider }}"
          if [[ -z "${provider}" ]]; then
            provider="kis"
          fi
          provider="${provider,,}"
          case "${provider}" in
            kis|pykrx) ;;
            *)
              echo "Unsupported provider: ${provider}" >&2
              exit 1
              ;;
          esac
          echo "provider=${provider}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ "${{ steps.params.outputs.provider }}" == "pykrx" ]]; then
            uv sync --locked --all-groups --extra pykrx
          else
            uv sync --locked --all-groups
          fi

      - name: Load holdings from Supabase
        id: holdings
        run: |
          set -euo pipefail

          supabase_key="${SUPABASE_SECRET_KEY:-}"
          if [[ -z "${supabase_key}" ]]; then
            echo "SUPABASE_SECRET_KEY must be set." >&2
            exit 1
          fi
          if [[ "${supabase_key}" == sb_publishable_* ]]; then
            echo "Publishable key is not allowed for server-side workflow jobs." >&2
            exit 1
          fi

          base_url="${SUPABASE_URL%/}"
          query="select=ticker,quantity,entry_price,entry_currency,entry_date,strategy,notes,tags,stop_override,target_override&quantity=gt.0&order=ticker.asc"

          curl -fsS "${base_url}/rest/v1/holdings?${query}" \
            -H "apikey: ${supabase_key}" \
            -H "Authorization: Bearer ${supabase_key}" \
            -H "Accept: application/json" \
            > holdings.supabase.json

          python - <<'PY'
          import json
          from pathlib import Path

          raw = json.loads(Path("holdings.supabase.json").read_text(encoding="utf-8"))
          if not isinstance(raw, list):
              raise SystemExit("Supabase holdings response must be a JSON array")

          payload: dict[str, list[dict[str, object]]] = {"holdings": []}
          keys = (
              "quantity",
              "entry_price",
              "entry_currency",
              "entry_date",
              "strategy",
              "notes",
              "tags",
              "stop_override",
              "target_override",
          )

          for row in raw:
              if not isinstance(row, dict):
                  continue
              ticker = str(row.get("ticker") or "").strip()
              if not ticker:
                  continue
              item: dict[str, object] = {"ticker": ticker}
              for key in keys:
                  value = row.get(key)
                  if value is None:
                      continue
                  item[key] = value
              payload["holdings"].append(item)

          out_path = Path("holdings.generated.yaml")
          out_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Prepared {len(payload['holdings'])} holdings to {out_path}")
          PY

          echo "holdings_file=holdings.generated.yaml" >> "${GITHUB_OUTPUT}"

      - name: Run sell
        id: run_sell
        run: |
          set -euo pipefail
          mkdir -p reports

          uv run -m sab sell \
            --provider "${{ steps.params.outputs.provider }}" \
            --holdings "${{ steps.holdings.outputs.holdings_file }}" 2>&1 | tee sell.log

          report_path="$(sed -n 's/.*Sell report written to: //p' sell.log | tail -n 1 | tr -d '\r')"
          if [[ -z "${report_path}" ]]; then
            report_path="$(python - <<'PY'
          from pathlib import Path

          paths = sorted(
              Path("reports").glob("*.sell.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          print(paths[0] if paths else "")
          PY
          )"
          fi

          if [[ -z "${report_path}" || ! -f "${report_path}" ]]; then
            echo "Sell report (*.sell.json) not found under reports/" >&2
            exit 1
          fi

          uploaded_key="$(sed -n 's/.*Sell report uploaded to Supabase: //p' sell.log | tail -n 1 | tr -d '\r')"

          echo "report_path=${report_path}" >> "${GITHUB_OUTPUT}"
          echo "uploaded_key=${uploaded_key}" >> "${GITHUB_OUTPUT}"

      - name: Upload generated report artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sell-report-${{ github.run_id }}
          path: ${{ steps.run_sell.outputs.report_path }}
          if-no-files-found: error

      - name: Build notification summary
        id: summary
        if: github.event_name == 'schedule' && success()
        env:
          REPORT_PATH: ${{ steps.run_sell.outputs.report_path }}
          STORAGE_KEY: ${{ steps.run_sell.outputs.uploaded_key }}
          PROVIDER: ${{ steps.params.outputs.provider }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from sab.report.notification_text import (
              build_sell_slack_summary_text,
              build_sell_telegram_report_text,
          )

          report_path = Path(os.environ["REPORT_PATH"])
          report = json.loads(report_path.read_text(encoding="utf-8"))

          repo = os.environ["GITHUB_REPOSITORY"]
          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{repo}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}"
          )
          provider = os.environ.get("PROVIDER", "").strip() or "kis"
          storage_key = os.environ.get("STORAGE_KEY", "").strip() or None

          slack_text = build_sell_slack_summary_text(
              report=report,
              repo=repo,
              run_url=run_url,
              provider=provider,
              storage_key=storage_key,
          )
          telegram_text = build_sell_telegram_report_text(
              report=report,
              run_url=run_url,
              provider=provider,
              include_actions=("SELL", "REVIEW"),
              storage_key=storage_key,
              max_items=5,
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write("slack_text<<EOF\n")
              fh.write(slack_text)
              fh.write("\nEOF\n")
              fh.write("telegram_text<<EOF\n")
              fh.write(telegram_text)
              fh.write("\nEOF\n")
          PY

      - name: Send Telegram notification (schedule only)
        if: github.event_name == 'schedule' && success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_TEXT: ${{ steps.summary.outputs.telegram_text }}
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN}" || -z "${TELEGRAM_CHAT_ID}" ]]; then
            echo "Telegram secrets not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE_TEXT}" \
            -d disable_web_page_preview=true

      - name: Send Slack notification (schedule only)
        if: github.event_name == 'schedule' && success()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MESSAGE_TEXT: ${{ steps.summary.outputs.slack_text }}
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL}" ]]; then
            echo "Slack webhook not set; skipping."
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request

          payload = json.dumps({"text": os.environ["MESSAGE_TEXT"]}).encode("utf-8")
          req = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              if resp.status >= 300:
                  raise RuntimeError(f"Slack webhook returned HTTP {resp.status}")
          PY
