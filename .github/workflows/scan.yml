name: Scan pipeline

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Market universe (KR|US|both)"
        required: false
        default: both
        type: choice
        options:
          - KR
          - US
          - both
      provider:
        description: "Data provider"
        required: false
        default: kis
        type: choice
        options:
          - kis
          - pykrx

concurrency:
  group: scan-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.inputs.provider || 'kis' }}-${{ github.event.inputs.universe || 'both' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_CACHE_DIR: .uv-cache
  PYTHONUNBUFFERED: "1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up mise toolchain
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: 2026.5.16
          cache: true
          install_args: --locked
          working_directory: .

      - name: Restore uv cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ env.UV_CACHE_DIR }}
          key: uv-${{ runner.os }}-${{ hashFiles('mise.toml', 'uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Resolve workflow inputs
        id: params
        run: |
          set -euo pipefail

          provider="${{ github.event.inputs.provider }}"
          if [[ -z "${provider}" ]]; then
            provider="kis"
          fi
          provider="${provider,,}"
          case "${provider}" in
            kis|pykrx) ;;
            *)
              echo "Unsupported provider: ${provider}" >&2
              exit 1
              ;;
          esac

          universe="${{ github.event.inputs.universe }}"
          if [[ -z "${universe}" ]]; then
            universe="both"
          fi

          case "${universe}" in
            KR|kr)
              dispatch_universe="KR"
              markets="KR"
              ;;
            US|us)
              dispatch_universe="US"
              markets="US"
              ;;
            both|BOTH)
              dispatch_universe="both"
              markets="KR,US"
              ;;
            *)
              echo "Unsupported universe: ${universe}" >&2
              exit 1
              ;;
          esac

          scan_universe_flag="both"
          if [[ "${provider}" == "pykrx" ]]; then
            if [[ "${dispatch_universe}" != "KR" ]]; then
              echo "provider=pykrx supports only universe=KR; got universe=${dispatch_universe}" >&2
              exit 1
            fi
            scan_universe_flag="watchlist"
          fi

          {
            echo "provider=${provider}"
            echo "dispatch_universe=${dispatch_universe}"
            echo "markets=${markets}"
            echo "scan_universe_flag=${scan_universe_flag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [[ "${{ steps.params.outputs.provider }}" == "pykrx" ]]; then
            uv sync --locked --all-groups --extra pykrx
          else
            uv sync --locked --all-groups
          fi

      - name: Ensure watchlist file
        run: |
          set -euo pipefail
          if [[ ! -f watchlist.txt ]]; then
            : > watchlist.txt
            echo "Created empty watchlist.txt for scan workflow baseline."
          fi

      - name: Validate pykrx watchlist
        if: steps.params.outputs.provider == 'pykrx'
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from sab.config import load_config, load_watchlist

          cfg = load_config(provider_override="pykrx")
          watchlist_path = cfg.watchlist_path or "watchlist.txt"
          tickers = load_watchlist(watchlist_path)
          if not tickers:
              raise SystemExit(
                  "provider=pykrx requires a non-empty watchlist. "
                  f"Add at least one ticker to '{watchlist_path}' "
                  "or set WATCHLIST_FILE/files.watchlist."
              )
          print(
              f"pykrx watchlist preflight passed: {len(tickers)} ticker(s) from {watchlist_path}"
          )
          PY

      - name: Run scan
        id: run_scan
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p reports

          set +e
          uv run -m sab scan \
            --provider "${{ steps.params.outputs.provider }}" \
            --markets "${{ steps.params.outputs.markets }}" \
            --universe "${{ steps.params.outputs.scan_universe_flag }}" 2>&1 | tee scan.log
          scan_status=${PIPESTATUS[0]}
          set -e

          report_path="$(sed -n 's/.*Buy report written to: //p' scan.log | tail -n 1 | tr -d '\r')"
          if [[ -z "${report_path}" ]]; then
            report_path="$(python - <<'PY'
          from pathlib import Path

          paths = sorted(
              Path("reports").glob("*.buy.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          print(paths[0] if paths else "")
          PY
          )"
          fi

          if [[ -z "${report_path}" || ! -f "${report_path}" ]]; then
            echo "Scan report (*.buy.json) not found under reports/" >&2
            exit 1
          fi

          uploaded_key="$(sed -n 's/.*Buy report uploaded to Supabase: //p' scan.log | tail -n 1 | tr -d '\r')"

          if [[ "${scan_status}" -ne 0 ]]; then
            exit "${scan_status}"
          fi

          {
            echo "report_path=${report_path}"
            echo "uploaded_key=${uploaded_key}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload generated report artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scan-report-${{ github.run_id }}
          path: ${{ steps.run_scan.outputs.report_path }}
          if-no-files-found: error
