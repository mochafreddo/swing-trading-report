name: Dependency major-version alert

on:
  schedule:
    # Weekly on Mondays at 09:10 UTC (adjust as needed)
    - cron: "10 9 * * 1"
  workflow_dispatch:

concurrency:
  group: deps-major-alert-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check for major updates on PyPI
        id: check
        run: |
          set -euo pipefail
          python scripts/check_major_updates.py | tee major-deps-report.md

      - name: Create or update issue (if major updates exist)
        if: steps.check.outputs.has_major == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '메이저 의존성 업데이트 가능';
            const body = fs.readFileSync('major-deps-report.md', 'utf8');

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const issue = existing.find(i => i.title === title && !i.pull_request);

            if (!issue) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['dependencies'],
              });
              return;
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });
