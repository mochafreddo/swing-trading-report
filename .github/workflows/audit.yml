name: Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow_audit:
    name: workflow_audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run actionlint
        uses: rhysd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8 # v1.7.11

  security_audit:
    name: security_audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Trivy audit (vuln + secret)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy versioning=semver
          version: v0.69.3
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-results.json
          exit-code: 1

      - name: Ensure Trivy artifact exists
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f trivy-results.json ]]; then
            printf '%s\n' '{"error":"trivy-results.json was not generated by trivy-action"}' > trivy-results.json
          fi

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: trivy-results-${{ github.run_id }}
          path: trivy-results.json
          if-no-files-found: error
