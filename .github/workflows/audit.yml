name: Audit

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow_audit:
    name: workflow_audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: rhysd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8 # v1.7.11

  security_audit:
    name: security_audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run Trivy gate audit (high/critical)
        id: trivy_gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy versioning=semver
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-gate-results.json
          exit-code: 1

      - name: Run Trivy report audit (moderate+)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # renovate: datasource=github-releases depName=aquasecurity/trivy versioning=semver
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-report-results.json
          exit-code: 0

      - name: Ensure Trivy gate artifact exists
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f trivy-gate-results.json ]]; then
            printf '%s\n' '{"error":"trivy-gate-results.json was not generated by trivy-action"}' > trivy-gate-results.json
          fi

      - name: Ensure Trivy report artifact exists
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f trivy-report-results.json ]]; then
            printf '%s\n' '{"error":"trivy-report-results.json was not generated by trivy-action"}' > trivy-report-results.json
          fi

      - name: Upload Trivy gate results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-gate-results-${{ github.run_id }}
          path: trivy-gate-results.json
          if-no-files-found: error

      - name: Upload Trivy report results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trivy-report-results-${{ github.run_id }}
          path: trivy-report-results.json
          if-no-files-found: error
