# Example configuration for sab (swing alert bot)

version: 1

data:
  provider: kis
  # 최종 평가 상한(워치리스트 + 스크리너 병합 후 적용, 0 이하는 무제한)
  screen_limit: 30
  report_dir: reports
  data_dir: data
  # KIS 장애 시 캐시 폴백을 허용할 최대 stale 세션 수 (시장별)
  market_cache_stale_sessions:
    kr: 1
    us: 1

kis:
  # Security policy: keep credentials in .env only.
  # Set KIS_APP_KEY / KIS_APP_SECRET via environment variables.
  base_url: https://openapivts.koreainvestment.com
  min_interval_ms: 200

screener:
  enabled: true
  limit: 20  # KR top-N (CLI --screener-limit 미지정 시 사용)
  only: false
  cache_ttl_minutes: 5
  min_price: 1000
  min_dollar_volume: 5000000000
  us:
    min_price: 5         # USD 기준 최소 가격
    min_dollar_volume: 5_000_000  # USD 기준(예: 500만 달러)
  # US simple screener defaults (optional)
  us_defaults:
    - AAPL.NAS
    - MSFT.NAS
    - NVDA.NAS
    - AMZN.NAS
    - META.NAS
    - GOOGL.NAS
  # US screener mode: 'defaults' or 'kis' (KIS rank APIs)
  us_mode: defaults
  # US KIS rank metric: 'volume' | 'market_cap' | 'value'
  us_metric: volume
  us_limit: 20  # US top-N (CLI --screener-limit 지정 시 KR/US 모두 CLI 값 우선)

strategy:
  # Buy strategy mode: 'sma_ema_hybrid' (SMA20 + EMA10/21 hybrid)
  # Legacy option: 'ema_cross' (EMA20/50)
  # Note: omitted/invalid modes still fall back to legacy defaults for compatibility.
  mode: sma_ema_hybrid
  use_sma200_filter: true
  use_market_regime_filter: true  # benchmark가 SMA200 아래면 해당 시장 scan 후보를 차단
  market_regime_unavailable_policy: block_market  # warn_continue | block_market
  require_slope_up: false          # applies to ema_cross mode only
  gap_atr_multiplier: 1.0
  min_history_bars: 200
  exclude_etf_etn: true
  rs_lookback_days: 60
  rs_benchmark_ticker_kr: 069500
  rs_benchmark_ticker_us: SPY.AMS
  # Hybrid strategy tuning (used when mode = sma_ema_hybrid)
  hybrid:
    sma_trend_period: 20          # SMA20: mid-term trend
    ema_short_period: 10          # EMA10: pullback/entry
    ema_mid_period: 21            # EMA21: medium-term momentum/support
    rsi_period: 14                # RSI(14)
    rsi_zone_low: 45.0            # swing zone lower bound
    rsi_zone_high: 60.0           # swing zone upper bound
    rsi_oversold_low: 30.0        # oversold band low
    rsi_oversold_high: 40.0       # oversold band high
    pullback_max_bars: 10         # max bars in pullback phase
    breakout_consolidation_min_bars: 5   # min bars in pre-breakout base
    breakout_consolidation_max_bars: 15  # max bars in pre-breakout base
    breakout_consolidation_max_range_pct: 0.10  # max pre-breakout box width
    volume_lookback_days: 5       # volume lookback for 5-day avg
    max_gap_pct: 0.05             # hard cap on acceptable gap (5%)
    use_sma60_filter: false       # optional SMA60 filter for KR mid/small caps
    sma60_period: 60
    kr_breakout_requires_confirmation: true  # require confirmation candle for KR breakouts

sell:
  # Sell mode: 'sma_ema_hybrid' (profit band + SMA20/EMA10/21 rules)
  # Legacy option: 'generic' (ATR/EMA20/50-based)
  # Note: omitted/invalid modes still fall back to legacy defaults for compatibility.
  mode: sma_ema_hybrid
  atr_trail_multiplier: 1.0  # > 0
  time_stop_days: 10         # >= 0
  require_sma200: true
  ema_short: 20              # >= 1
  ema_long: 50               # >= 1
  rsi_period: 14             # >= 1
  rsi_floor: 50              # >= 0
  rsi_floor_alt: 30          # >= 0
  min_bars: 20               # >= 1
  # Hybrid sell tuning (used when mode = sma_ema_hybrid)
  hybrid:
    profit_target_low: 0.05        # low target: tighten protection stop, no immediate sell
    profit_target_high: 0.10       # high target: stronger protection, sell only on reversal/protection break
    partial_profit_floor: 0.03     # arm break-even protection once profit reaches this floor
    ema_short_period: 10           # >= 1
    ema_mid_period: 21             # >= 1
    sma_trend_period: 20           # >= 1
    rsi_period: 14                 # >= 1
    stop_loss_pct_min: 0.03        # >= 0 and <= stop_loss_pct_max
    stop_loss_pct_max: 0.05        # >= 0
    failed_breakout_drop_pct: 0.03 # >= 0
    min_bars: 20                   # >= 1
    time_stop_days: 0              # >= 0 (0 disables)
    time_stop_grace_days: 0        # >= 0
    time_stop_profit_floor: 0.00   # >= 0 (e.g., 0.03 = 3%)

entry_check:
  fatal_missing_price_ratio: 0.0  # 0.0이면 entry price 누락 1건도 실패

universe:
  markets:
    - KR
    - US

files:
  holdings: holdings.yaml
  watchlist: watchlist.txt

fx:
  mode: kis              # kis | manual | off
  cache_ttl_minutes: 10  # FX 캐시 유지 시간(분)
  kis_symbol: AAPL.NAS   # 선택: 환율 조회용 대표 종목 (없으면 자동 추정)
  usdkrw: 1320.0         # manual 모드 또는 폴백용 고정 환율
