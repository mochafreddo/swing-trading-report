[project]
name = "swing-trading-report"
version = "1.33.1"
description = "Swing-trading signal scanner and report generator for KR/US markets"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "idna>=3.13,<4",
    "pyyaml>=6.0.3,<7",
    "requests>=2.33.0,<3",
]

[project.optional-dependencies]
dotenv = [
    "python-dotenv>=1.2.1,<2",
]
calendar = [
    "pandas-market-calendars>=5.1.3,<6",
]
pykrx = [
    "pykrx>=1.0.0,<2",
]
full = [
    "python-dotenv>=1.2.1,<2",
    "pandas-market-calendars>=5.1.3,<6",
    "pykrx>=1.0.0,<2",
]
ui = [
    "fastapi>=0.128.4,<1",
    "uvicorn>=0.40.0,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0,<1",
    "pre-commit>=4.5.1,<5",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "mypy>=2.1,<3",
    "pip-audit>=2.9.0,<3",
    "python-dotenv>=1.2.1,<2",
    "vulture>=2.16,<3",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["sab", "tests"]
extend-exclude = [
    "/data",
    "/reports",
    ".pre-commit-cache",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "RUF",
]
ignore = [
    "E501",
    "RUF001",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
ignore_missing_imports = false
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
files = [
    "sab",
    "tests/**/*.py",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
