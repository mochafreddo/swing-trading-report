repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (uv)
        language: system
        entry: uv run ruff check --config pyproject.toml
        types: [python]
      - id: ruff-format
        name: ruff format (uv)
        language: system
        entry: uv run ruff format --config pyproject.toml
        types: [python]
      - id: mypy
        name: mypy (uv)
        language: system
        entry: uv run mypy --config-file pyproject.toml sab
        pass_filenames: false
